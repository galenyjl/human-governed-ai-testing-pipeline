<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title desc">
  <title id="title">Human-Governed AI Testing Pipeline</title>
  <desc id="desc">A generic AI-assisted testing pipeline showing work item, brief, human review, planning, generation, CI/CD, failure classification, healer handoff, and success metrics.</desc>
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .title { font: 800 34px Arial, sans-serif; fill: #172033; letter-spacing: 1px; }
      .subtitle { font: 700 15px Arial, sans-serif; fill: #0f766e; letter-spacing: 1.5px; }
      .caption { font: 600 13px Arial, sans-serif; fill: #64748b; letter-spacing: 1.2px; }
      .phase { fill: #ffffff; stroke-width: 3; rx: 14; }
      .header { fill: var(--c); }
      .phase-label { font: 800 13px Arial, sans-serif; fill: #ffffff; letter-spacing: 1.5px; }
      .badge { fill: rgba(255,255,255,0.23); }
      .badge-text { font: 800 10px Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .card { fill: #f8fafc; stroke: #dbe3ef; stroke-width: 1.5; rx: 10; }
      .card-title { font: 800 16px Arial, sans-serif; fill: var(--c); }
      .text { font: 13px Arial, sans-serif; fill: #334155; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .strong { font: 800 13px Arial, sans-serif; fill: #1f2937; }
      .arrow { font: 28px Arial, sans-serif; fill: #94a3b8; }
      .gate { fill: #fffbeb; stroke: #d97706; stroke-width: 3; rx: 14; }
      .gate-title { font: 800 17px Arial, sans-serif; fill: #92400e; letter-spacing: .8px; }
      .gate-text { font: 13px Arial, sans-serif; fill: #78350f; }
      .artifact { fill: #ecfdf5; stroke: #0d9488; stroke-width: 3; rx: 14; }
      .artifact-title { font: 800 17px Arial, sans-serif; fill: #0f766e; letter-spacing: .6px; }
      .artifact-text { font: 13px Arial, sans-serif; fill: #134e4a; }
      .metric { fill: #eef6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 10; }
      .metric-title { font: 800 14px Arial, sans-serif; fill: #2563eb; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="1700"/>

  <text x="600" y="62" text-anchor="middle" class="title">HUMAN-GOVERNED AI TESTING PIPELINE</text>
  <text x="600" y="92" text-anchor="middle" class="subtitle">AI GENERATES. HUMANS DECIDE. NO EXCEPTIONS.</text>
  <text x="600" y="126" text-anchor="middle" class="caption">WORK ITEM -&gt; BRIEF -&gt; GENERATION -&gt; CI/CD; HEALER RUNS ONLY ON CI FAILURE</text>

  <g style="--c:#3b82f6">
    <rect x="120" y="160" width="960" height="125" class="phase" stroke="#3b82f6"/>
    <rect x="120" y="160" width="960" height="34" class="header" rx="14"/>
    <rect x="140" y="169" width="70" height="18" class="badge" rx="5"/>
    <text x="175" y="183" text-anchor="middle" class="badge-text">PHASE 1</text>
    <text x="230" y="183" class="phase-label">REQUIREMENTS / WORK ITEM</text>
    <rect x="150" y="212" width="900" height="48" class="card"/>
    <text x="170" y="242" class="card-title">Signed-off acceptance criteria</text>
    <text x="470" y="242" class="text">Primary source of product intent; no generation before intent exists.</text>
  </g>

  <text x="600" y="320" text-anchor="middle" class="arrow">v</text>

  <g style="--c:#7c3aed">
    <rect x="120" y="345" width="960" height="190" class="phase" stroke="#7c3aed"/>
    <rect x="120" y="345" width="960" height="34" class="header" rx="14"/>
    <rect x="140" y="354" width="70" height="18" class="badge" rx="5"/>
    <text x="175" y="368" text-anchor="middle" class="badge-text">PHASE 2</text>
    <text x="230" y="368" class="phase-label">BRIEF PROMPT / CONTEXT REVIEW</text>
    <rect x="150" y="400" width="280" height="100" class="card"/>
    <text x="170" y="430" class="card-title">Extract intent</text>
    <text x="170" y="458" class="text">Behavior, roles, identity paths,</text>
    <text x="170" y="478" class="text">assertions, out-of-scope items.</text>
    <rect x="460" y="400" width="280" height="100" class="card"/>
    <text x="480" y="430" class="card-title">Review prior briefs</text>
    <text x="480" y="458" class="text">Use prior briefs as context,</text>
    <text x="480" y="478" class="text">not authority.</text>
    <rect x="770" y="400" width="280" height="100" class="card"/>
    <text x="790" y="430" class="card-title">Rejected assumptions</text>
    <text x="790" y="458" class="text">Make invalid assumptions visible</text>
    <text x="790" y="478" class="text">so they are not regenerated.</text>
  </g>

  <text x="600" y="570" text-anchor="middle" class="arrow">v</text>

  <rect x="120" y="595" width="960" height="70" class="gate"/>
  <text x="600" y="625" text-anchor="middle" class="gate-title">HUMAN REVIEW GATE</text>
  <text x="600" y="650" text-anchor="middle" class="gate-text">Unresolved gaps block handoff. Approved brief becomes the contract.</text>

  <text x="600" y="700" text-anchor="middle" class="arrow">v</text>

  <rect x="120" y="725" width="960" height="82" class="artifact"/>
  <text x="600" y="757" text-anchor="middle" class="artifact-title">APPROVED BRIEF: SINGLE SOURCE OF TRUTH</text>
  <text x="600" y="783" text-anchor="middle" class="artifact-text">Downstream agents read the brief, not the original work item or the UI, when deciding what the test means.</text>

  <text x="600" y="842" text-anchor="middle" class="arrow">v</text>

  <g style="--c:#059669">
    <rect x="120" y="865" width="960" height="205" class="phase" stroke="#059669"/>
    <rect x="120" y="865" width="960" height="34" class="header" rx="14"/>
    <rect x="140" y="874" width="70" height="18" class="badge" rx="5"/>
    <text x="175" y="888" text-anchor="middle" class="badge-text">PHASE 3</text>
    <text x="230" y="888" class="phase-label">PLAN AND GENERATE</text>
    <rect x="150" y="920" width="430" height="105" class="card"/>
    <text x="170" y="950" class="card-title">Planner agent</text>
    <text x="170" y="978" class="text">Converts approved brief into smoke, regression,</text>
    <text x="170" y="998" class="text">role matrix, data strategy, and scenario boundaries.</text>
    <rect x="620" y="920" width="430" height="105" class="card"/>
    <text x="640" y="950" class="card-title">Generator agent</text>
    <text x="640" y="978" class="text">Converts test plan into BDD, Playwright code,</text>
    <text x="640" y="998" class="text">then self-corrects authoring-time code issues.</text>
  </g>

  <text x="600" y="1105" text-anchor="middle" class="arrow">v</text>

  <g style="--c:#0d9488">
    <rect x="120" y="1130" width="960" height="145" class="phase" stroke="#0d9488"/>
    <rect x="120" y="1130" width="960" height="34" class="header" rx="14"/>
    <rect x="140" y="1139" width="70" height="18" class="badge" rx="5"/>
    <text x="175" y="1153" text-anchor="middle" class="badge-text">PHASE 4</text>
    <text x="230" y="1153" class="phase-label">HUMAN PR REVIEW</text>
    <rect x="150" y="1185" width="280" height="60" class="card"/>
    <text x="170" y="1218" class="strong">Correct intent?</text>
    <rect x="460" y="1185" width="280" height="60" class="card"/>
    <text x="480" y="1218" class="strong">Assertions preserved?</text>
    <rect x="770" y="1185" width="280" height="60" class="card"/>
    <text x="790" y="1218" class="strong">Data safe for parallel runs?</text>
  </g>

  <text x="600" y="1310" text-anchor="middle" class="arrow">v</text>

  <g style="--c:#d97706">
    <rect x="120" y="1335" width="460" height="175" class="phase" stroke="#d97706"/>
    <rect x="120" y="1335" width="460" height="34" class="header" rx="14"/>
    <rect x="140" y="1344" width="70" height="18" class="badge" rx="5"/>
    <text x="175" y="1358" text-anchor="middle" class="badge-text">PHASE 5</text>
    <text x="230" y="1358" class="phase-label">CI/CD EXECUTION</text>
    <text x="150" y="1398" class="text">Runner: GitHub Actions, Azure DevOps, or another CI system.</text>
    <text x="150" y="1423" class="text">Optional: container execution, secret provider, cross-browser service.</text>
    <text x="150" y="1448" class="text">Artifacts: trace, screenshot, video, HTML report, CI logs.</text>
    <text x="150" y="1473" class="text">Pass: confidence signal. Fail: trigger conditional recovery.</text>
  </g>

  <g style="--c:#dc2626">
    <rect x="620" y="1335" width="460" height="175" class="phase" stroke="#dc2626"/>
    <rect x="620" y="1335" width="460" height="34" class="header" rx="14"/>
    <rect x="640" y="1344" width="70" height="18" class="badge" rx="5"/>
    <text x="675" y="1358" text-anchor="middle" class="badge-text">PHASE 6</text>
    <text x="730" y="1358" class="phase-label">HEALER AGENT RECOVERY</text>
    <text x="650" y="1398" class="text">Conditional recovery: triggered only if CI/CD fails.</text>
    <text x="650" y="1423" class="text">Healer triages: env, implementation drift, intent mismatch,</text>
    <text x="650" y="1448" class="text">product defect, flaky/no-root-cause, or data/state sensitivity.</text>
    <text x="650" y="1473" class="text">Fixes execution only. Cannot change assertions or intent.</text>
  </g>

  <text x="600" y="1548" text-anchor="middle" class="arrow">v</text>

  <rect x="120" y="1570" width="460" height="90" class="artifact"/>
  <text x="350" y="1603" text-anchor="middle" class="artifact-title">HEALER HANDOFF</text>
  <text x="350" y="1628" text-anchor="middle" class="artifact-text">Proposed diff only. No silent commit, push, or PR.</text>
  <rect x="620" y="1570" width="460" height="90" class="metric"/>
  <text x="850" y="1603" text-anchor="middle" class="metric-title">SUCCESS METRICS</text>
  <text x="850" y="1628" text-anchor="middle" class="small">Acceptance rate, review time, flaky rate, token/runtime cost.</text>
</svg>
